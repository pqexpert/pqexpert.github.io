name: Publish public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public source
        run: python scripts/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage reviewed public files
        run: python scripts/build_public_site.py "$RUNNER_TEMP/pqexpert-public-site"
      - name: Upload public artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pqexpert-public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public artifact
        id: deployment
        uses: actions/deploy-pages@v4
