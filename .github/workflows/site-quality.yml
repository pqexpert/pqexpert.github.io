name: Site quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static site quality checks
        run: python scripts/check_site.py

      - name: Verify deployable public artifact
        run: |
          python scripts/build_public_site.py "$RUNNER_TEMP/pqexpert-review-artifact"
          test ! -e "$RUNNER_TEMP/pqexpert-review-artifact/assets/img/headshot.jpg"
